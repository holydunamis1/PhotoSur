name: photosur
description: Remove photo backgrounds instantly. Free, with ads. Go ad-free for $0.99/mo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State & Navigation ---
  provider: ^6.1.5+1
  go_router: ^16.2.0

  # --- Image & Camera ---
  camera: ^0.12.0+2
  image_picker: ^1.2.3
  image: ^4.5.4
  gal: ^2.3.0
  crop_your_image: ^2.0.0
  flutter_image_compress: ^2.5.1

  # --- On-Device ML ---
  tflite_flutter: ^0.12.1

  # --- Storage ---
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  # SHA-256 check of the downloaded HD model. Version verified live on pub.dev
  # (latest stable 3.0.7).
  crypto: ^3.0.7

  # --- Local notifications (unfinished-edit reminders) ---
  # Versions verified live on pub.dev: flutter_local_notifications latest is
  # 22.3.1; timezone ^0.11.0 is the range the plugin itself depends on.
  # Needs Java 17 + core library desugaring (android/app/build.gradle) and
  # compileSdk >= 35.
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0

  # --- Sharing & External Links ---
  share_plus: ^13.3.0
  cross_file: ^0.3.5+1
  url_launcher: ^6.3.2

  # --- Monetization ---
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  app_tracking_transparency: ^2.0.6+1
  permission_handler: ^12.0.0

  # --- Localization ---
  # flutter_localizations from Flutter 3.44.7 pins intl to 0.20.2.
  intl: ^0.20.2

  # --- UI ---
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

  # --- Codegen ---
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  freezed: ^3.2.5
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo.svg
    - assets/images/
    - assets/templates/
    - assets/models/segmentation.tflite
    - assets/licenses/u2net_apache2.txt
    - assets/licenses/inter_ofl.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600


# shared_preferences_android 2.5.0 (published Oct 17, 2026, "Pigeon JNI")
# made reading saved settings fail on the phone in release builds with
# NoSuchMethodError (SharedPreferencesApiRegistrar.getAll), so the app lost
# its settings on every launch and returned to onboarding. 2.4.29 is the
# last release before that change (listed on its pub.dev changelog).
# pubspec.lock is gitignored, so without this pin CI resolves the newest
# version on every build. Remove the pin only after a newer release is
# verified on a real phone.
dependency_overrides:
  shared_preferences_android: 2.4.29
